name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle installs
        # the NDK and CMake versions it needs on first build.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ularn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-debug-apk
          path: ularn.apk

      # Every push to main becomes a release, so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/ularn.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ularn build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ularn.apk
          body: |
            Install on your phone: open this page in the phone's browser and tap **ularn.apk**.
            Android will ask once to allow installs from your browser.

            Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/ularn.apk

            Commit: ${{ github.sha }}
