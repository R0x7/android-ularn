name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ULARN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ularn.keystore"
            echo "ULARN_KEYSTORE=$RUNNER_TEMP/ularn.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ULARN_KEYSTORE_B64 secret not set; using a random debug key (updates won't install over older builds)"
          fi
      - name: Build debug APK
        env:
          ULARN_KEYSTORE_PASSWORD: ${{ secrets.ULARN_KEYSTORE_PASSWORD }}
        # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle installs
        # the NDK and CMake versions it needs on first build.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ularn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-debug-apk
          path: ularn.apk

      # Every push to main becomes a release, so this link always gets the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/ularn.apk
      # Not in the R0x7/ularn-wild repo, which merges this file in from here
      # and publishes its own wild-latest prerelease instead.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.name != 'ularn-wild'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ularn build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ularn.apk
          body: |
            Install on your phone: open this page in the phone's browser and tap **ularn.apk**.
            Android will ask once to allow installs from your browser.

            Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/ularn.apk

            Commit: ${{ github.sha }}
