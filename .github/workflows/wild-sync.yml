name: Merge main into ularn-wild

# Lives on main (and, via the merges, on ularn-wild too, where it never runs).
# The base app (main) is the original game plus QoL changes; the Wild Edition
# (ularn-wild) is main plus the Wild features. Every push to main is merged
# into ularn-wild so both apps get the same QoL changes. See AGENTS.md.
#
# Clean merge: pushed to ularn-wild, then ularn-wild's own workflows (APK
# build + wild-latest prerelease, web port) are started by hand, because a
# push made with Actions' token does not start other workflows.
#
# Conflicts, or a push GitHub refuses (Actions' token may not push commits
# that change files under .github/workflows/): main is pushed to the
# MERGE_BRANCH branch and a pull request into ularn-wild is opened (an issue
# if Actions may not open pull requests). Resolve it there, or by hand:
#   git checkout ularn-wild && git merge main && git push
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  WILD_BRANCH: ularn-wild
  MERGE_BRANCH: auto/main-into-ularn-wild

permissions:
  contents: write       # push ularn-wild and the merge branch
  actions: write        # start ularn-wild's workflows
  pull-requests: write  # open the pull request when the merge conflicts
  issues: write         # fallback when Actions may not open pull requests

concurrency:
  group: wild-sync
  cancel-in-progress: false

jobs:
  merge:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.WILD_BRANCH }}
          fetch-depth: 0

      - name: Merge main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main is already merged into ${WILD_BRANCH}."
            echo "result=nothing" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit -m "Merge main into ${WILD_BRANCH} (auto)" origin/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Push ularn-wild
        id: push
        if: steps.merge.outputs.result == 'merged'
        continue-on-error: true
        run: git push origin "HEAD:${WILD_BRANCH}"

      - name: Build and publish the Wild Edition
        if: steps.merge.outputs.result == 'merged' && steps.push.outcome == 'success'
        run: |
          gh workflow run build.yml --ref "${WILD_BRANCH}"
          if gh workflow view web-sync.yml --ref "${WILD_BRANCH}" > /dev/null 2>&1; then
            gh workflow run web-sync.yml --ref "${WILD_BRANCH}"
          fi

      - name: Ask for a hand merge
        if: steps.merge.outputs.result == 'conflict' || (steps.merge.outputs.result == 'merged' && steps.push.outcome != 'success')
        env:
          WHY: ${{ steps.merge.outputs.result == 'conflict' && 'main does not merge cleanly into ularn-wild' || 'GitHub refused the automatic push to ularn-wild (most likely main changed a workflow file, which Actions may not push)' }}
        run: |
          echo "::warning::${WHY}; asking for a hand merge."
          title="Merge main into ${WILD_BRANCH}"
          body=$(cat <<BODY
          ${WHY}, so the automatic merge stopped.

          Merge by hand:

          \`\`\`
          git checkout ${WILD_BRANCH}
          git pull
          git merge origin/main
          git push
          \`\`\`

          Or resolve the conflicts in this pull request and merge it (it brings main, at ${GITHUB_SHA::7}, into ${WILD_BRANCH}).
          Keep QoL changes from main and Wild features from ${WILD_BRANCH}; see AGENTS.md.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          BODY
          )
          # A branch at main's commit, so resolving conflicts in GitHub's
          # editor commits to it and not to main.
          if git push -f origin "origin/main:refs/heads/${MERGE_BRANCH}"; then
            existing=$(gh pr list --head "${MERGE_BRANCH}" --base "${WILD_BRANCH}" --state open --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              gh pr comment "$existing" --body "main moved to ${GITHUB_SHA::7}; this pull request now brings that in. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              exit 0
            fi
            if gh pr create --head "${MERGE_BRANCH}" --base "${WILD_BRANCH}" --title "$title" --body "$body"; then
              exit 0
            fi
          fi
          # No pull request (Actions may not open them, or the branch push was
          # refused): open an issue instead, once.
          existing=$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still needed: main is now at ${GITHUB_SHA::7}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
            gh issue create --title "$title" --body "$body"
          fi
