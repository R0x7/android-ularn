name: Web build (GitHub Pages)

# Builds the browser version (web/, Emscripten) and publishes it to the
# gh-pages branch, which GitHub Pages serves at https://<owner>.github.io/<repo>/
# (Settings -> Pages -> Deploy from a branch -> gh-pages, / (root)).
#
# This runs for pushes to the web branch itself. Pushes to ularn-wild are
# handled by web-sync.yml (on ularn-wild), which merges them into the web
# branch and publishes in one go.
on:
  push:
    branches: [ccr-fa7a4c55-ev0a7r]
    paths: [web/**, app/src/main/cpp/**, app/src/main/assets/**, .github/workflows/web*.yml]
  workflow_dispatch:

permissions:
  contents: write   # to push the gh-pages branch

concurrency:
  group: web-pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: sudo apt-get update -q && sudo apt-get install -y -q emscripten
      - name: Build
        run: web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-web
          path: web/site
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: web/publish.sh "${GITHUB_REF_NAME} ${GITHUB_SHA}"
