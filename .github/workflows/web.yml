name: Web build (GitHub Pages)

# Builds the browser version (web/, Emscripten) and publishes it to the
# gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/  (Settings -> Pages -> Deploy from a
# branch -> gh-pages, / (root); needed once).
on:
  push:
    branches: [main, ularn-wild, ccr-fa7a4c55-ev0a7r]
    paths: [web/**, app/src/main/cpp/**, app/src/main/assets/**, .github/workflows/web.yml]
  workflow_dispatch:

permissions:
  contents: write   # to push the gh-pages branch

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Emscripten
        run: sudo apt-get update -q && sudo apt-get install -y -q emscripten
      - name: Build
        run: web/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ularn-web
          path: web/site
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd web/site
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Web build from ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
